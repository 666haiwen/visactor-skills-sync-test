name: Publish Skills
run-name: Publish Skills after main CI

on:
  workflow_run:
    workflows: [Skills CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: skills-release
  cancel-in-progress: false

jobs:
  release:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          python-version: '3.12'
          enable-cache: false
      - name: Publish the reviewed plan from the verified main commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-project python .github/scripts/release_plan.py --mode publish --output .cache/release-artifacts
      - name: Save release packages for inspection
        if: ${{ always() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: skills-release-artifacts
          path: .cache/release-artifacts/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
